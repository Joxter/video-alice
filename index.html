<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Alice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Video Alice</h1>
    <button id="newBtn" class="btn ghost hidden">New video</button>
  </header>

  <main>
    <!-- Upload screen -->
    <section id="uploadScreen" class="upload">
      <div id="dropZone" class="dropzone">
        <p class="drop-title">Drop a short video here</p>
        <p class="drop-hint">or</p>
        <button id="pickBtn" class="btn primary">Choose a video</button>
        <p class="drop-note">Best with clips around 10 seconds. Nothing leaves your device.</p>
      </div>
      <input id="fileInput" type="file" accept="video/*" hidden />
    </section>

    <!-- Editor screen -->
    <section id="editorScreen" class="editor hidden">
      <div class="toolbar">
        <div class="tool-group swatches" id="swatches"></div>
        <div class="tool-group sizes" id="sizes">
          <button class="size-btn" data-size="6" title="Thin" aria-label="Thin brush">
            <span class="size-dot"></span>
          </button>
          <button class="size-btn active" data-size="14" title="Medium" aria-label="Medium brush">
            <span class="size-dot"></span>
          </button>
          <button class="size-btn" data-size="28" title="Thick" aria-label="Thick brush">
            <span class="size-dot"></span>
          </button>
        </div>
        <div class="tool-group">
          <button id="eraserBtn" class="btn tool icon" title="Eraser" aria-label="Eraser">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.5 20.5 3.9 15.9a2 2 0 0 1 0-2.8l8.6-8.6a2 2 0 0 1 2.8 0l4.6 4.6a2 2 0 0 1 0 2.8l-8.6 8.6z" />
              <path d="M9 9.5 15.5 16" />
              <path d="M9 20.5h11" />
            </svg>
          </button>
          <button id="undoBtn" class="btn tool icon" title="Undo" aria-label="Undo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h9a5.5 5.5 0 0 1 0 11h-5" />
              <path d="M8 4.5 3.5 9 8 13.5" />
            </svg>
          </button>
          <button id="clearBtn" class="btn tool icon" title="Clear this drawing" aria-label="Clear this drawing">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6.5h16" />
              <path d="M9.5 6.5V4h5v2.5" />
              <path d="M6.5 6.5 7.6 20h8.8l1.1-13.5" />
              <path d="M10 10v6M14 10v6" />
            </svg>
          </button>
        </div>
      </div>

      <div class="stage" id="stage">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="exportOverlay" class="export-overlay hidden">
          <div class="export-box">
            <p id="exportLabel">Making your video…</p>
            <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
          </div>
        </div>
      </div>

      <div class="timeline-wrap">
        <div class="timeline-row">
          <button id="prevDrawBtn" class="btn round dot" title="Previous drawing" aria-label="Previous drawing">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5" cy="12" r="2.5" class="dot-mark" />
              <path d="M18 6l-6 6 6 6" />
            </svg>
          </button>
          <div id="timeline" class="timeline">
            <div id="trimRegion" class="trim-region"></div>
            <div id="keyframes" class="keyframes"></div>
            <div id="playhead" class="playhead"></div>
            <div id="handleStart" class="handle handle-start"></div>
            <div id="handleEnd" class="handle handle-end"></div>
          </div>
          <button id="nextDrawBtn" class="btn round dot" title="Next drawing" aria-label="Next drawing">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l6 6-6 6" />
              <circle cx="19" cy="12" r="2.5" class="dot-mark" />
            </svg>
          </button>
        </div>
        <div class="time-readout">
          <span id="timeLabel" class="time-now">0:00.00</span>
        </div>
      </div>

      <div class="controls">
        <button id="backSecBtn" class="btn round" title="Back 1 second" aria-label="Back one second">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.5 6 11.5 12l6 6" />
            <path d="M11 6 5 12l6 6" />
          </svg>
        </button>
        <button id="backFrameBtn" class="btn round small" title="Back a few frames" aria-label="Back a few frames">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.5 6 8.5 12l6 6" />
          </svg>
        </button>
        <button id="playBtn" class="btn play" aria-label="Play">▶</button>
        <button id="stopBtn" class="btn round" title="Stop" aria-label="Stop">■</button>
        <button id="fwdFrameBtn" class="btn round small" title="Forward a few frames" aria-label="Forward a few frames">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.5 6l6 6-6 6" />
          </svg>
        </button>
        <button id="fwdSecBtn" class="btn round" title="Forward 1 second" aria-label="Forward one second">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 6l6 6-6 6" />
            <path d="M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>

      <div class="actions">
        <button id="downloadBtn" class="btn primary">Download video</button>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
